<style>
  :root{
    --ground:#f5f7fb; --card:#ffffff; --ink:#15202f; --muted:#5c6b80; --faint:#8a97a8;
    --axis:#1a56c4; --target:#c0392b; --good:#1d9e75;
    --border:#e4e9f1; --grid:#e9eef7; --rule:#eef2f8;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);line-height:1.55;
    -webkit-font-smoothing:antialiased;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:26px 26px;background-position:-1px -1px;}
  article{max-width:1080px;margin:0 auto;padding:56px 24px 96px}
  h1,h2,h3{text-wrap:balance;margin:0}

  .masthead{margin-bottom:44px}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);margin:0 0 14px;display:flex;align-items:center;gap:10px}
  .badge{color:var(--axis);border:1px solid #c3d3f2;background:#eef4ff;border-radius:5px;
    padding:1px 8px;letter-spacing:.04em}
  h1{font-size:clamp(30px,4.4vw,46px);font-weight:680;letter-spacing:-.018em;line-height:1.06}
  .lede{max-width:64ch;color:var(--muted);font-size:16px;margin:16px 0 26px}

  .gates{display:flex;flex-wrap:wrap;gap:9px}
  .pill{display:inline-flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--border);
    border-radius:999px;padding:7px 15px 7px 12px;font-size:13px;box-shadow:0 1px 2px rgba(20,40,70,.04)}
  .pill .dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(29,158,117,.16)}
  .pill-k{color:var(--muted)} .pill-v{font-weight:600;font-variant-numeric:tabular-nums}

  section{margin-top:52px}
  h2{font-size:15px;font-weight:640;letter-spacing:.01em;color:var(--ink);
    padding-bottom:12px;margin-bottom:22px;border-bottom:1px solid var(--rule);
    display:flex;align-items:baseline;gap:12px}
  h2 .count,h2 .note{font-weight:400;color:var(--faint);font-size:13px;font-family:var(--mono)}

  .tablewrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:14px}
  thead th{text-align:left;font-weight:600;color:var(--faint);font-size:11px;letter-spacing:.07em;
    text-transform:uppercase;padding:0 16px 9px;border-bottom:1px solid var(--border)}
  tbody td{padding:10px 16px;border-bottom:1px solid var(--rule);vertical-align:top}
  td.k{font-family:var(--mono);color:var(--axis);white-space:nowrap}
  td.v{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
  td.n{color:var(--muted)}
  .constants .note{margin-top:16px;color:var(--muted);font-size:13.5px;max-width:70ch}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 16px 14px;
    box-shadow:0 1px 2px rgba(20,40,70,.04);margin:0;display:flex;flex-direction:column}
  figcaption{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .marker{font-family:var(--mono);font-size:15px;color:var(--target);font-weight:600;line-height:1}
  .card h3{font-size:14px;font-weight:600;letter-spacing:-.005em}
  .plot{background:#fff;border:1px solid var(--rule);border-radius:8px;padding:8px;
    display:flex;justify-content:center;align-items:center;overflow-x:auto;
    background-image:linear-gradient(#f3f6fb 1px,transparent 1px),linear-gradient(90deg,#f3f6fb 1px,transparent 1px);
    background:#fff}
  .plot svg{max-width:100%;height:auto;border:0}
  .desc{color:var(--muted);font-size:13px;margin:12px 2px 8px}
  details{margin-top:auto;border-top:1px solid var(--rule);padding-top:9px}
  summary{cursor:pointer;font-family:var(--mono);font-size:11.5px;color:var(--faint);
    letter-spacing:.03em;display:flex;justify-content:space-between;align-items:center;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸ ";color:var(--axis)}
  details[open] summary::before{content:"▾ "}
  .hash{color:#b6c0cf}
  pre{font-family:var(--mono);font-size:11px;line-height:1.5;color:#38465a;background:#f7f9fc;
    border:1px solid var(--rule);border-radius:6px;padding:10px;margin:9px 0 2px;overflow-x:auto;white-space:pre-wrap;word-break:break-word}
  a:focus-visible,summary:focus-visible{outline:2px solid var(--axis);outline-offset:2px;border-radius:3px}.q{font-size:12.5px;color:#38465a;margin:0 0 10px}.a{font-family:var(--mono);font-size:12px;color:var(--target);margin:10px 2px 4px;font-weight:600}
</style>

<h1>度数分布・代表値 図レンダリング検収</h1>

<div class="pill"><span class="dot"></span><span class="pill-k">図悉皆</span><span class="pill-v">2400/2400</span></div>
