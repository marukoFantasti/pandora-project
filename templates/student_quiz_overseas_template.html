    {{PAGE_TITLE}}    - <title>タグの中身

    {{KANJI_QUIZ}}      - kanjiQuiz配列の中身（無ければ空のまま）
    {{QUESTIONS}}       - questions配列の中身

'use strict';

function createMathDisplay(lexicon, counterTable, readingEngineFactory) {
  const RE = readingEngineFactory || (typeof require !== 'undefined' ? require('../pattern_bank/reading_engine.js').createEngine
    : (typeof window !== 'undefined' && window.ReadingEngine && window.ReadingEngine.createEngine));
  if (!RE) throw new Error('reading_engine(createEngine) が見つかりません');

  function escapeHtml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  // toRuby の 漢字/数字連《よみ》 を <ruby>base<rt>よみ</rt></ruby> へ
  function rubyMarkupToHtml(s) { return s.replace(/([一-鿿々\d０-９]+)《([^》]+)》/g, '<ruby>$1<rt>$2</rt></ruby>'); }
  function isBuai(unitSystem) { return typeof unitSystem === 'string' && /歩合|buai/i.test(unitSystem); }

  // text: 表示文字列。opts.mode/unitSystem。戻り値は mode に応じた文字列。
  function processMathText(text, opts) {
    opts = opts || {};
    const mode = opts.mode || 'ruby';
    if (text == null || mode === 'off') return text == null ? '' : String(text);
    const eopts = { buai: isBuai(opts.unitSystem) };
    if (mode === 'kana') return engine.toHiragana(String(text), eopts);
    // ruby: HTMLエスケープ→ルビ注釈→<ruby>化(既存quiz_templateの escapeHtml→rubyToHtml と同順)
    return rubyMarkupToHtml(engine.toRuby(escapeHtml(String(text)), eopts));

        <div style={{background:"white",borderRadius:14,marginBottom:14,border:"2px solid #1a9fd4",overflow:"hidden",boxShadow:"0 2px 6px rgba(0,0,0,0.07)"}}>
          <div style={{padding:"12px"}}>
            <p style={{fontSize:14,fontWeight:"bold",color:"#1a9fd4",margin:"0 0 2px 0"}}>✏️ なまえ / Your name</p>
            <DrawCanvas id="name" height={70} label={null} canvasRef={nameCanvasRef}/>
          </div>
        </div>

        {questions.map((q,idx)=>{
          const lb=LEVEL_BADGE[q.level]||{label:q.level,color:"#888",bg:"#f5f5f5"};
          const rq = mdKanaText(q); const rubyHtml = mdRubyHtml(q);
          const uc=UNIT_COLORS[q.unit]||{color:"#555",bg:"#f5f5f5"};
          return (
            <div key={q.id} id={'q-'+q.id} style={{background:"white",borderRadius:14,marginBottom:14,border:"2px solid #dde3f0",overflow:"hidden",boxShadow:"0 2px 6px rgba(0,0,0,0.07)"}}>
              <div style={{background:"linear-gradient(90deg,#1a9fd4,#0277bd)",padding:"8px 14px",display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
                <span style={{background:"white",color:"#0277bd",borderRadius:6,padding:"2px 8px",fontSize:12,fontWeight:"bold"}}>Q{idx+1}</span>
                <span style={{background:uc.bg,color:uc.color,borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:"bold"}}>{q.unit}</span>
                <span style={{background:lb.bg,color:lb.color,borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:"bold"}}>{lb.label}</span>
              </div>

              <div style={{padding:"14px 12px"}}>
                <div style={{display:"flex",gap:10,alignItems:"flex-start",marginBottom:12}}>
                  <div style={{flexShrink:0}}>{illustrations[q.id]}</div>
                  <p style={{fontSize:15,lineHeight:2.1,color:"#1a1a1a",fontWeight:"500",margin:0,wordBreak:"break-word"}}>{rubyHtml ? <span dangerouslySetInnerHTML={{__html: rubyHtml}}/> : q.jp}</p>
                </div>

                <button onClick={()=>speak(rq)}
                  style={{background:speaking===rq?"#e3f2fd":"#f5f5f5",border:`1px solid ${speaking===rq?"#1a9fd4":"#ddd"}`,color:speaking===rq?"#1a9fd4":"#666",padding:"5px 12px",borderRadius:8,fontSize:12,cursor:"pointer",marginBottom:12}}>
                  {speaking===rq?"🔊 Playing...":"🔊 読んでみよう / Read aloud"}
                </button>

                <DrawCanvas id={`eq_${q.id}`} height={225} internalHeight={225} label="📐 式を書こう / Write your equation" canvasRef={eqRefs.current[q.id]}/>
                <DrawCanvas id={`ans_${q.id}`} height={110} label="✍️ 答えを書こう / Write your answer" canvasRef={ansRefs.current[q.id]}/>

                <div style={{display:"flex",gap:8,marginTop:12,flexWrap:"wrap",alignItems:"center"}}>
                  <button onClick={()=>setShowWords(p=>({...p,[q.id]:!p[q.id]}))}
                    style={{background:showWords[q.id]?"#fff3e0":"#f5f5f5",border:`1px solid ${showWords[q.id]?"#ff9800":"#ddd"}`,color:showWords[q.id]?"#e65100":"#666",padding:"6px 12px",borderRadius:8,fontSize:12,cursor:"pointer"}}>
                    📖 ことば / Words
                  </button>
                  <button onClick={()=>setShowHint(p=>({...p,[q.id]:!p[q.id]}))}
                    style={{background:showHint[q.id]?"#e8f5e9":"#f5f5f5",border:`1px solid ${showHint[q.id]?"#43a047":"#ddd"}`,color:showHint[q.id]?"#2e7d32":"#666",padding:"6px 12px",borderRadius:8,fontSize:12,cursor:"pointer"}}>
                    🇬🇧 English hint
                  </button>
                  <button onClick={()=>{
                    if(idx < questions.length-1){
                      const next=document.getElementById('q-'+questions[idx+1].id);
                      if(next) next.scrollIntoView({behavior:'smooth',block:'start'});
                    } else {
                      const kanjiEl=document.getElementById('kanji-section');
                      if(kanjiEl) kanjiEl.scrollIntoView({behavior:'smooth',block:'start'});
                    }
                  }} style={{marginLeft:"auto",background:idx < questions.length-1?"#1a9fd4":"#e53935",color:"white",border:"none",padding:"8px 18px",borderRadius:10,fontSize:13,fontWeight:"bold",cursor:"pointer",boxShadow:"0 2px 6px rgba(0,0,0,0.2)"}}>
                    {idx < questions.length-1 ? "次の問題へ ▼" : "漢字コーナーへ ▼"}
                  </button>
                </div>
              </div>

              {showWords[q.id]&&(
                <div style={{borderTop:"1px solid #fff3e0",background:"#fffbf0",padding:"12px"}}>
                  <p style={{fontSize:11,color:"#e65100",fontWeight:"bold",margin:"0 0 8px 0"}}>📖 ことば / Words</p>
                  {q.words.map((w,i)=>(
                    <div key={i} style={{background:"white",border:"1px solid #ffe0b2",borderRadius:10,padding:"8px 10px",marginBottom:6}}>
                      <p style={{fontSize:14,fontWeight:"bold",color:"#333",margin:"0 0 2px 0"}}>{w.word}</p>
                      <p style={{fontSize:13,color:"#1a73e8",margin:"0 0 2px 0"}}>🇬🇧 {w.meaning}</p>
                      <p style={{fontSize:11,color:"#888",margin:0}}>例: {w.example}</p>
                    </div>
                  ))}
                </div>
              )}
              {showHint[q.id]&&(
                <div style={{borderTop:"1px solid #e8f5e9",background:"#f1f8f1",padding:"12px"}}>
                  <p style={{fontSize:11,color:"#2e7d32",fontWeight:"bold",margin:"0 0 4px 0"}}>🇬🇧 English hint</p>
                  <p style={{fontSize:14,color:"#333",margin:0,fontStyle:"italic"}}>{q.hint}</p>
                </div>
              )}

            </div>
          );
        })}

        {/* 今日の漢字コーナー */}
        <div id="kanji-section" style={{background:"linear-gradient(135deg,#e65100,#bf360c)",borderRadius:14,padding:"14px 16px",marginBottom:12}}>
          <h2 style={{color:"white",fontSize:16,fontWeight:"bold",margin:"0 0 2px 0"}}>🈳 今日の漢字 / Today's Kanji 🔵</h2>
          <p style={{color:"rgba(255,255,255,0.8)",fontSize:12,margin:0}}>距・倍・計　選んで、書いてみよう！</p>
        </div>

        {kanjiQuiz.map(k=>{
          const selected=kanjiAnswers[k.id];const isCorrect=selected===k.correct;
          return (
            <div key={k.id} style={{background:"white",borderRadius:14,marginBottom:14,border:`2px solid ${selected?(isCorrect?"#43a047":"#e53935"):"#dde3f0"}`,overflow:"hidden",boxShadow:"0 2px 6px rgba(0,0,0,0.07)"}}>
              <div style={{padding:"14px 12px"}}>
                <div style={{display:"flex",gap:6,marginBottom:10}}>
                  <span style={{background:"#e65100",color:"white",borderRadius:6,padding:"2px 8px",fontSize:12,fontWeight:"bold"}}>漢字</span>
                </div>
                <div style={{display:"flex",gap:12,alignItems:"center",marginBottom:10}}>
                  <div style={{flexShrink:0}}><KanjiIllustration id={k.id}/></div>
                  <div>
                    <p style={{fontSize:18,fontWeight:"bold",color:"#222",margin:"0 0 6px 0"}}>{k.en} = {k.reading}</p>
                    <p style={{fontSize:13,color:"#888",margin:0,fontStyle:"italic"}}>{k.hint}</p>
                  </div>
                </div>
                <p style={{fontSize:14,color:"#333",margin:"0 0 10px 0",fontWeight:"bold"}}>「{k.reading}」の漢字はどれ？ / Which kanji?</p>
                <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:10}}>
                  {k.choices.map(choice=>{
                    let bg="#f5f5f5",border="#ddd",color="#333";
                    if(selected){if(choice===k.correct){bg="#e8f5e9";border="#43a047";color="#2e7d32";}else if(choice===selected&&choice!==k.correct){bg="#ffebee";border="#e53935";color="#c62828";}}
                    return <button key={choice} onClick={()=>handleKanji(k.id,choice)}
                      style={{background:bg,border:`2px solid ${border}`,color,padding:"12px 16px",borderRadius:10,fontSize:20,cursor:selected?"default":"pointer",fontWeight:"bold",minWidth:70}}>{choice}</button>;
                  })}
                </div>
                {selected&&<p style={{fontSize:14,fontWeight:"bold",color:isCorrect?"#43a047":"#e53935",marginBottom:10}}>{isCorrect?"✓ 正解！Correct! 🎉":`✗ 正解は「${k.correct}」/ The answer is「${k.correct}」`}</p>}
                <DrawCanvas id={k.id} height={160} label="✍️ 書いてみよう！/ Let's write it!" canvasRef={kanjiRefs.current[k.id]}/>
              </div>
            </div>
          );
        })}

        {submitError&&<div style={{background:"#ffebee",border:"1px solid #e53935",borderRadius:10,padding:"10px 14px",marginBottom:8,fontSize:13,color:"#c62828"}}>⚠️ {submitError}</div>}
        <button onClick={handleSubmit} disabled={submitting}
          style={{width:"100%",background:submitting?"#90a4ae":"linear-gradient(135deg,#1a9fd4,#0277bd)",color:"white",border:"none",padding:"17px",borderRadius:16,fontSize:16,cursor:submitting?"default":"pointer",fontWeight:"bold",boxShadow:submitting?"none":"0 4px 14px rgba(26,159,212,0.4)",transition:"all 0.2s"}}>
          {submitting?"⏳ Submitting...":"📬 できた！提出する / Submit!"}
        </button>
      </div>
    </div>
  );
}

ReactDOM.render(React.createElement(App), document.getElementById("root"));
</script>
</body>
</html>
